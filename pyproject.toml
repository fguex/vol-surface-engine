[project]
name = "vol-surface-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openbb>=4.7.2",
    "openbb-cboe>=1.6.1",
    "pandas>=3.0.5",
    "polars>=1.44.2",
    "psycopg[binary]>=3.3.5",
    "pyarrow>=25.0.1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
